<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0" />
  <title>__TITLE__</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="assets/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="reel" data-width="1080" data-height="1920" data-fps="30" data-duration="__DURATION__">
    __CLIPS__
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>
    <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
  </div>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var total = __DURATION__;
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#progress-bar", { scaleX: 0 }, { scaleX: 1, duration: total, ease: "none" }, 0);
      var hook = document.getElementById("hook");
      if (hook) {
        var hookDur = parseFloat(hook.getAttribute("data-duration") || "3");
        tl.fromTo(hook, { opacity: 0, y: 28, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power2.out" }, 0);
        if (hookDur > 0.8) {
          tl.to(hook, { opacity: 0, y: -16, duration: 0.35, ease: "power2.in" }, Math.max(0.5, hookDur - 0.35));
        }
      }
      window.__timelines["reel"] = tl;
    })();
  </script>
</body>
</html>

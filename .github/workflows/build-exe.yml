name: Build Windows EXE Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Determine Version (dd.MM.yyyy)
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $v = "${{ github.ref_name }}"
          } else {
            $v = "v" + (Get-Date -Format "dd.MM.yyyy")
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Build version: $v"

      - name: Inject OAuth App Config from Repository Secrets
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
        run: |
          $cfg = @{
            google = @{
              client_id = if ($env:GOOGLE_OAUTH_CLIENT_ID) { $env:GOOGLE_OAUTH_CLIENT_ID } else { "" }
              client_secret = if ($env:GOOGLE_OAUTH_CLIENT_SECRET) { $env:GOOGLE_OAUTH_CLIENT_SECRET } else { "" }
            }
            facebook = @{
              app_id = if ($env:FB_APP_ID) { $env:FB_APP_ID } else { "" }
              app_secret = if ($env:FB_APP_SECRET) { $env:FB_APP_SECRET } else { "" }
            }
          }
          $cfg | ConvertTo-Json -Depth 4 | Set-Content -Path "src\installer\app_oauth_config.json" -Encoding utf8
          Write-Host ("OAuth config generated: Google=" + [bool]$env:GOOGLE_OAUTH_CLIENT_ID + ", Facebook=" + [bool]$env:FB_APP_ID)

      - name: Build OpenClaw-VideoFactory-Setup.exe
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.VERSION }}"
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "OpenClaw-VideoFactory-Setup-$v" `
            --paths "src\installer" `
            --add-data "src\video_factory;src\video_factory" `
            --add-data "src\skill;src\skill" `
            --add-data "src\installer\app_oauth_config.json;src\installer" `
            "src\installer\app_gui.py"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-VideoFactory-Setup-${{ steps.ver.outputs.VERSION }}
          path: dist/OpenClaw-VideoFactory-Setup-*.exe

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenClaw-VideoFactory-Setup-*.exe

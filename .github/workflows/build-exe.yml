name: Build Windows EXE Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build OpenClaw-VideoFactory-Setup.exe
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "OpenClaw-VideoFactory-Setup" `
            --paths "src\installer" `
            --add-data "src\video_factory;src\video_factory" `
            --add-data "src\skill;src\skill" `
            "src\installer\app_gui.py"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenClaw-VideoFactory-Setup
          path: dist/OpenClaw-VideoFactory-Setup.exe

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OpenClaw-VideoFactory-Setup.exe
